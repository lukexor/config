general {
    gaps_in = 2
    gaps_out = 4
}

master {
  mfact = 0.6
  # Ensure new windows go to top of stack, so when closing, active ends up being
  # most recent
  new_on_top = true
}

misc {
    mouse_move_enables_dpms = false
    key_press_enables_dpms = true
}

cursor {
    enable_hyprcursor = true
}
