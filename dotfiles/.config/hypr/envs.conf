# Omarchy should be setting these but isn't for some reason
env = OMARCHY_PATH,$HOME/.local/share/omarchy

# GPU vars (EGL/GLX/VAAPI vendor, AQ_DRM_DEVICES) live in ~/.config/uwsm/env-hyprland
# instead: they differ per machine, and only that file can branch on what is present.
# Helps resume from sleep
env = OGL_DEDICATED_HW_STATE_PER_CONTEXT,ENABLE_ROBUST
env = ELECTRON_OZONE_PLATFORM_HINT,auto
