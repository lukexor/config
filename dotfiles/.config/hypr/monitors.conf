# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.6

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# Or for ultrawide monitors like 34" 3440x1440 or 49" 5120x1440
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Portrait/rotated secondary monitor (transform: 1 = 90°, 3 = 270°)
# monitor = DP-2, preferred, auto, 1, transform, 1

# Rules naming an output that is not connected are inert - the workspace bindings
# included - so every machine's displays live here and each applies only its own.

# Laptop. HDMI-A-1 hangs off the dGPU, so it stays dark whenever that card is kept
# out of the session (see ~/.config/uwsm/env-hyprland).
monitor = eDP-1,    preferred, auto,  1.2
monitor = eDP-2,    preferred, auto,  1
monitor = HDMI-A-1, preferred, auto,  1
workspace = 1, monitor:eDP-1, default:true, on-created-empty:alacritty

# Desktop
monitor = HDMI-A-2, preferred, auto,  1
workspace = 1, monitor:HDMI-A-2, default:true, on-created-empty:alacritty

# Mirror display
# monitor = , preferred, auto, 1, mirror, eDP-1
