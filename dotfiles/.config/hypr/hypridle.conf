# Hibernate on long idle. Omarchy's shell owns the screensaver and the lock
# screen, so this file carries only the timer the shell has no setting for.
#
# systemd-logind's IdleAction cannot do this job: it fires on the session's
# IdleHint, and nothing under Hyprland ever sets that hint, so the timer never
# starts. hypridle listens on the ext-idle-notify Wayland protocol instead,
# which is the same source the Omarchy shell reads.

# s2idle never reaches S0ix on this machine, because the dGPU is pinned in D0
# with the iGPU disabled, so an idle "suspend" keeps the CPU burning watts with
# no fan curve. S4 cuts power entirely.
listener {
    timeout = 1800
    on-timeout = systemctl hibernate
}
