# Omarchy's default foot.ini with three changes: the font, copy-on-select, and
# window transparency. See $OMARCHY_PATH/config/foot/foot.ini for the original.

[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=DejaVuSansM Nerd Font Mono:size=9
pad=14x14
initial-window-mode=windowed
workers=0

# Put the selection on the clipboard as well as the primary selection, so a
# drag is enough to paste anywhere.
selection-target=both

# The theme file above fills in [colors-dark]. Alpha is per-section, so it has
# to be named in both to survive a light theme.
[colors-dark]
alpha=0.90

[colors-light]
alpha=0.90

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
