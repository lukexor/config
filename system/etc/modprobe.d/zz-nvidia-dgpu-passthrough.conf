# The dGPU belongs to the VM, not to this session.
#
# Named zz- so it sorts last: modprobe reads every file in /etc/modprobe.d and
# accumulates the `options` lines, and for a parameter given more than once the
# last value wins. omarchy's install/config/hardware/nvidia.sh:21 rewrites
# /etc/modprobe.d/nvidia.conf unconditionally with `sudo tee`, so anything put
# there is one `omarchy update` away from being silently reverted. The NVreg
# settings below are restated for that reason, not because they differ - the
# point is that they survive the rewrite. Same defence as
# /etc/mkinitcpio.conf.d/zz-no-nvidia.conf.

# modeset=0 stops nvidia_drm registering a DRM device for the dGPU at all.
#
# AQ_DRM_DEVICES pins the session to the iGPU, but it only filters Aquamarine's
# initial scanGPUs. Because nvidia is kept out of the initramfs (it breaks
# hibernate resume - see /etc/mkinitcpio.conf.d/zz-no-nvidia.conf), nvidia_drm
# now registers card0 seconds after the session has already scanned, arriving as
# a udev `add` that never re-applies the explicit list:
#
#   drm: Explicit device list /dev/dri/card1
#   drm: Found 1 GPUs
#   udev: new udev add event for card0
#   drm: Starting backend for /dev/dri/card0, with driver nvidia-drm
#
# With no DRM device there is no add event and nothing to attach, which beats
# blocking the attach after the fact - there is no error path to get wrong.
#
# Nothing needed is lost: the dGPU drives no outputs in this configuration, and
# early KMS and Plymouth already run entirely on i915/eDP (fb0 = i915drmfb).
# /dev/nvidia0 still exists, so CUDA and compute on the host are unaffected.
# Reverting to a dGPU-driven session means modeset=1 here plus a reboot, not
# just the logout the old AQ_DRM_DEVICES-only setup needed.
options nvidia_drm modeset=0 fbdev=0

# Kept from the file this supersedes. PreserveVideoMemoryAllocations is what
# makes suspend/hibernate restore VRAM contents rather than corrupt them; with
# driver 610.x the handshake runs through kernel suspend notifiers, so
# /proc/driver/nvidia/suspend no longer exists and nvidia-sleep.sh correctly
# no-ops. TemporaryFilePath must not be a tmpfs, hence /var/tmp.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
